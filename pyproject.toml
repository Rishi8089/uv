dependencies = [
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "ddgs>=9.16.0",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "langchain>=1.3.18",
    "langchain-aws>=1.7.4",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-experimental>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-groq>=1.0.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph-prebuilt>=1.1.0",
    "langgraph-sdk>=0.4.4",
    "langgraph-supervisor>=0.0.31",
    "langsmith>=0.11.2",
    "notebook>=7.6.2",
    "pip-system-certs>=5.3",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "streamlit>=1.62.0",
    "trustcall>=0.0.39",
    "uvicorn>=0.52.4",
    "wikipedia>=1.4.0",
]

[project.scripts]
healthbot = "healthbot:main"

[build-system]
